[package]
name = "reportable"
version = "0.1.1"
authors = ["Ben Schreiber <bschreiber91@gmail.com>"]
edition = "2024"
rust-version = "1.85"
description = "Classify errors for internal reporting or delivery to the caller"
license = "MIT"
readme = "README.md"
repository = "https://github.com/ben-schreiber/reportable"
documentation = "https://docs.rs/reportable"
include = ["src/**", "tests/**", "README.md", "LICENSE"]
keywords = ["error", "derive", "reporting", "observability"]
categories = ["rust-patterns", "no-std"]

[workspace]
members = ["reportable-derive"]
resolver = "3"

[dependencies]
reportable-derive = { version = "=0.1.1", path = "reportable-derive" }

[dev-dependencies]
thiserror = "2"
