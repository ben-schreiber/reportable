[package]
name = "reportable-derive"
version = "0.1.1"
authors = ["Ben Schreiber <bschreiber91@gmail.com>"]
edition = "2024"
rust-version = "1.85"
description = "Derive macro for reportable error classification"
license = "MIT"
readme = "README.md"
repository = "https://github.com/ben-schreiber/reportable"
documentation = "https://docs.rs/reportable-derive"
keywords = ["error", "derive", "reporting"]
categories = ["rust-patterns"]
include = ["src/**", "README.md", "LICENSE"]

[lib]
proc-macro = true

[dependencies]
proc-macro-crate = "3"
proc-macro2 = "1"
quote = "1"
syn = "2"
