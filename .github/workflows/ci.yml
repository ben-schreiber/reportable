name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: 🦀 Rust ${{ matrix.toolchain }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        toolchain: [stable, '1.85.0']
    steps:
      - name: 📥 Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: 🦀 Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          targets: thumbv7em-none-eabi
          components: ${{ matrix.toolchain == 'stable' && 'rustfmt, clippy' || '' }}

      - name: 🧪 Test
        run: cargo +${{ matrix.toolchain }} test --workspace --locked

      - name: 🔬 Check no_std
        run: cargo +${{ matrix.toolchain }} check --lib --locked --target thumbv7em-none-eabi

      - name: 🎨 Check formatting
        if: matrix.toolchain == 'stable'
        run: cargo +stable fmt --all --check

      - name: 📎 Lint
        if: matrix.toolchain == 'stable'
        run: cargo +stable clippy --workspace --all-targets --locked -- -D warnings

      - name: 📚 Build documentation
        if: matrix.toolchain == 'stable'
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo +stable doc --workspace --no-deps --locked

      - name: 📦 Verify crate archives
        if: matrix.toolchain == 'stable'
        run: cargo +stable package --workspace --locked
